name: Deploy public product site

on:
  push:
    branches:
      - master
      - agent/prepare-riot-production-submission
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/app
          cp -R site/. _site/
          cp index.html styles.css core.js app.js manifest.json _site/app/
          if [ -f guided.html ]; then cp guided.html _site/app/; fi
          if [ -f riot.txt ]; then cp riot.txt _site/riot.txt; fi
          touch _site/.nojekyll

      - name: Validate required public files
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/demo.html
          test -f _site/reviewer.html
          test -f _site/privacy.html
          test -f _site/terms.html
          test -f _site/compliance.html
          test -f _site/support.html
          test -f _site/app/index.html
          test -f _site/app/core.js
          test -f _site/app/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
